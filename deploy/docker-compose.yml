# Runs Leaf Peep on a single DigitalOcean Droplet: HTTPS proxy, the app, the open model, and TimescaleDB.
# Set DATABASE_URL in ../.env to use Tiger Cloud instead of the bundled TimescaleDB,
# and SPACES_* to store photos in DigitalOcean Spaces instead of the uploads volume.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      SITE: ${SITE:?set SITE in .env}
    depends_on: [app]

  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      MODEL_API: ollama
      MODEL_URL: http://ollama:11434
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:leafpeep@db:5432/leafpeep}
    volumes:
      - uploads:/app/uploads
    depends_on: [ollama, db]

  db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: leafpeep
      POSTGRES_DB: leafpeep
    volumes: [pgdata:/var/lib/postgresql/data]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [ollama:/root/.ollama]
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  caddy_data:
  uploads:
  pgdata:
  ollama:

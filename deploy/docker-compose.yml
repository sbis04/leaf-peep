# Runs Leaf Peep on a single DigitalOcean Droplet: HTTPS proxy, the app, and the open model.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      SITE: ${SITE}
    depends_on: [app]

  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      MODEL_API: ollama
      MODEL_URL: http://ollama:11434
    depends_on: [ollama]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [ollama:/root/.ollama]
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    # Uncomment on a GPU Droplet (needs the NVIDIA container toolkit, preinstalled on DO's AI/ML images)
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  caddy_data:
  ollama:
